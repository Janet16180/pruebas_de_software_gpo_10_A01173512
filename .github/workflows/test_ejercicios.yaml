name: Test Ejercicios Programacion

on:
  push:
    paths:
      - "1_ejercicios_programacion/**"
  pull_request:
    paths:
      - "1_ejercicios_programacion/**"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --dev

      - name: Run tests
        run: uv run pytest 1_ejercicios_programacion/ -v
